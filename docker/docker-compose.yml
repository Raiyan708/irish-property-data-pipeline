services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ppr-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ppr-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ppr-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ppr-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  producer:
    build:
      context: ..
      dockerfile: docker/ingestion/Dockerfile
    container_name: ppr-producer
    depends_on:
      - kafka
    volumes:
      - ../ingestion:/app/ingestion
      - ../data:/app/data
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: property_transactions
      CSV_PATH: /app/data/raw/ppr_all.csv
      PYTHONPATH: /app
    command: python -m ingestion.producer

  spark-bronze:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    container_name: ppr-spark-bronze
    depends_on:
      - kafka
    volumes:
      - ../streaming:/app/streaming
      - ../data:/app/data
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: property_transactions
      BRONZE_PATH: /app/data/delta/bronze/property_transactions
      BRONZE_CHECKPOINT_PATH: /app/data/delta/_checkpoints/bronze/property_transactions
      STREAMING_TRIGGER_MODE: once
      PYTHONPATH: /app
    command: >
      /opt/spark/bin/spark-submit
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      streaming/bronze_ingest.py

  spark-silver:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    container_name: ppr-spark-silver
    volumes:
      - ../streaming:/app/streaming
      - ../data:/app/data
    working_dir: /app
    environment:
      BRONZE_PATH: /app/data/delta/bronze/property_transactions
      SILVER_PATH: /app/data/delta/silver/property_transactions
      SILVER_CHECKPOINT_PATH: /app/data/delta/_checkpoints/silver/property_transactions
      PYTHONPATH: /app
    command: >
      /opt/spark/bin/spark-submit
      --packages io.delta:delta-spark_2.12:3.2.0
      streaming/silver_transform.py

  spark-gold:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    container_name: ppr-spark-gold
    volumes:
      - ../streaming:/app/streaming
      - ../data:/app/data
    working_dir: /app
    environment:
      SILVER_PATH: /app/data/delta/silver/property_transactions
      GOLD_PATH: /app/data/delta/gold/county_yearly_price_summary
      PYTHONPATH: /app
    command: >
      /opt/spark/bin/spark-submit
      --packages io.delta:delta-spark_2.12:3.2.0
      streaming/gold_transform.py

  load-gold:
    build:
      context: ..
      dockerfile: docker/warehouse/Dockerfile
    container_name: ppr-load-gold
    volumes:
      - ../warehouse:/app/warehouse
      - ../data:/app/data
      - ../gcp-credentials.json:/app/gcp-credentials.json:ro
    working_dir: /app
    environment:
      GOLD_PATH: /app/data/delta/gold/county_yearly_price_summary
      GCP_PROJECT_ID: irish-ppr-pipeline
      BQ_DATASET: ppr_warehouse
      BQ_TABLE: county_yearly_price_summary
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
      PYTHONPATH: /app
    command: python -m warehouse.load_gold

  dbt:
    build:
      context: ..
      dockerfile: docker/dbt/Dockerfile
    container_name: ppr-dbt
    volumes:
      - ../dbt:/app/dbt
      - ../gcp-credentials.json:/app/gcp-credentials.json:ro
    working_dir: /app/dbt
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
      DBT_PROFILES_DIR: /app/dbt
    entrypoint: dbt
    command: run

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    container_name: ppr-dashboard
    volumes:
      - ../dashboard:/app/dashboard
      - ../gcp-credentials.json:/app/gcp-credentials.json:ro
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
      GCP_PROJECT_ID: irish-ppr-pipeline
      BQ_DATASET: ppr_warehouse
      BQ_TABLE: property_price_summary
      PYTHONPATH: /app
    command: streamlit run dashboard/app.py --server.address=0.0.0.0

  postgres:
    image: postgres:16
    container_name: ppr-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    container_name: ppr-airflow-init
    depends_on:
      - postgres
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /Users/muhammadraiyan/irish-property-data-pipeline/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: ppr-local-dev-secret
    volumes: &airflow-common-volumes
      # Mounted at the SAME absolute path as on the host -- Airflow launches
      # sibling containers (producer/spark-bronze/spark-silver) via the
      # host's Docker daemon (see the docker.sock mount below), and that
      # daemon only understands real host paths, not paths inside this
      # container. See docker-compose.yml's comment history / chat for why.
      - /Users/muhammadraiyan/irish-property-data-pipeline:/Users/muhammadraiyan/irish-property-data-pipeline
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    container_name: ppr-airflow-webserver
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    container_name: ppr-airflow-scheduler
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  airflow-postgres-data:
